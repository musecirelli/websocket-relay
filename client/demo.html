<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>websocket-relay — Echo demo (Step 1)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  #log { background:#111; color:#ddd; padding:12px; border-radius:8px; min-height:160px; white-space:pre-wrap; font-family: ui-monospace, monospace; font-size:13px; }
  .row { display:flex; gap:8px; margin:16px 0; }
  input { flex:1; padding:8px; font-size:16px; }
  button { padding:8px 16px; font-size:16px; cursor:pointer; }
  .ok { color:#7ee787; } .err { color:#ff7b72; } .dim { color:#888; }
</style>
</head>
<body>
<h1>WebSocket Relay — Echo</h1>
<p>Server must be running on the Mac: <code>python3 server/server.py</code><br>
It listens on <code>ws://127.0.0.1:8765</code> — when this page is opened <em>on the Mac</em>, localhost is the Mac.</p>

<div class="row">
  <input id="msg" value="hello" placeholder="message to echo">
  <button id="send">Send echo</button>
  <button id="ping">Ping</button>
</div>
<div id="log"></div>

<!-- In a real page you'd load snippet.js; it's inlined here so demo.html is self-contained -->
<script>
class WsRpc {
  constructor(url = 'ws://127.0.0.1:8765') {
    this.url = url; this.ws = null; this._nextId = 1; this._pending = new Map();
  }
  connect() {
    return new Promise((resolve, reject) => {
      this.ws = new WebSocket(this.url);
      this.ws.onopen = () => resolve(this);
      this.ws.onerror = (e) => reject(e);
      this.ws.onmessage = (event) => this._onMessage(event.data);
      this.ws.onclose = () => {
        for (const { reject } of this._pending.values()) reject(new Error('WebSocket closed'));
        this._pending.clear();
      };
    });
  }
  _onMessage(data) {
    let msg; try { msg = JSON.parse(data); } catch { return; }
    for (const res of (Array.isArray(msg) ? msg : [msg])) {
      const p = this._pending.get(res.id); if (!p) continue;
      this._pending.delete(res.id);
      if (res.error) { const e = new Error(res.error.message); e.code = res.error.code; p.reject(e); }
      else p.resolve(res.result);
    }
  }
  call(method, params) {
    const id = this._nextId++;
    return new Promise((resolve, reject) => {
      this._pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ jsonrpc: '2.0', method, params, id }));
    });
  }
  close() { this.ws?.close(); }
}
window.WsRpc = WsRpc;
</script>

<script>
const logEl = document.getElementById('log');
function log(text, cls='') {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  logEl.appendChild(span);
}

let rpc = null;
async function ensureConnected() {
  if (rpc && rpc.ws && rpc.ws.readyState === WebSocket.OPEN) return rpc;
  log('connecting to ws://127.0.0.1:8765 …', 'dim');
  rpc = new WsRpc('ws://127.0.0.1:8765');
  await rpc.connect();
  log('connected', 'ok');
  return rpc;
}

document.getElementById('send').onclick = async () => {
  const message = document.getElementById('msg').value;
  try {
    const client = await ensureConnected();
    log(`→ echo  ${JSON.stringify(message)}`);
    const result = await client.call('echo', message);
    log(`← result ${JSON.stringify(result)}`, 'ok');
  } catch (e) {
    log(`✗ ${e.message || e}`, 'err');
  }
};

document.getElementById('ping').onclick = async () => {
  try {
    const client = await ensureConnected();
    log('→ ping');
    const result = await client.call('ping');
    log(`← result ${JSON.stringify(result)}`, 'ok');
  } catch (e) {
    log(`✗ ${e.message || e}`, 'err');
  }
};

// Auto-connect + auto-echo "hello" on load — that's the Step 1 test
ensureConnected()
  .then(c => c.call('echo', 'hello'))
  .then(r => log(`auto-echo on load: ← ${JSON.stringify(r)}`, 'ok'))
  .catch(e => log(`auto-echo failed: ${e.message || e} — is the server running on the Mac?`, 'err'));
</script>
</body>
</html>
